name: Desktop installers

# Builds the Windows installer (.exe) and the macOS disk image (.dmg).
# Run it from the Actions tab ("Run workflow"), or push a tag like desktop-v0.1.0.
# Each run attaches both files to a GitHub release so they can be downloaded directly.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API the app talks to
        default: https://api.unipal.group
        required: true
  push:
    tags: ['desktop-v*']
  # Pull requests that touch packaging build both installers (as run artifacts) without publishing.
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - apps/unipal/windows/**
      - apps/unipal/macos/**

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  API_URL: ${{ inputs.api_url || 'https://api.unipal.group' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep '^version:' apps/unipal/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/unipal
        run: flutter build windows --release --dart-define=UNIPAL_API_URL=${{ env.API_URL }}
      - name: Bundle the Visual C++ runtime
        # Flutter's Windows runner needs these DLLs; bundling them avoids asking staff to install the redistributable.
        shell: pwsh
        run: |
          $dest = "apps/unipal/build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $dest
          }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        working-directory: apps/unipal/windows/installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.version.outputs.version }} unipal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: UniPal-Windows
          path: apps/unipal/build/installer/UniPal-Setup-*.exe
          if-no-files-found: error

  macos:
    name: macOS disk image
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/unipal
        run: flutter build macos --release --dart-define=UNIPAL_API_URL=${{ env.API_URL }}
      - name: Package
        # Not notarized yet (no Apple Developer account), so first launch needs right-click > Open.
        run: |
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R apps/unipal/build/macos/Build/Products/Release/unipal.app "$staging/UniPal.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname UniPal -srcfolder "$staging" -ov -format UDZO \
            "UniPal-${{ needs.version.outputs.version }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: UniPal-macOS
          path: UniPal-*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, windows, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="desktop-v$VERSION-build.$GITHUB_RUN_NUMBER"; fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "UniPal desktop $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes "API: $API_URL. Windows: run UniPal-Setup. macOS: open the .dmg, drag UniPal to Applications, then right-click > Open the first time."
