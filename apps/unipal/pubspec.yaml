name: unipal
description: UniPal internal app for employees (Android, iOS, Windows, macOS).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  intl: any
  url_launcher: ^6.3.0
  unipal_api:
    path: ../../packages/unipal_api
  # Colors, type and theme come only from the brand package, pinned like the web apps pin it.
  unipal_brand:
    git:
      url: https://github.com/unipalsolutions/unipal-brand.git
      ref: 9f0dbad2e0e914b535ea3fdeb7c285a6343206cc
      path: flutter

dev_dependencies:
  http: ^1.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Readex Pro (SIL Open Font License, assets/fonts/OFL.txt), the brand typeface for Arabic and Latin.
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro.ttf
